apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kova-dev
  namespace: istio-system
spec:
  # Secret name where cert will be stored
  secretName: kova-tls-cert

  # Certificate duration and renewal
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days before expiration

  # Issuer reference (uses cluster's Let's Encrypt issuer)
  issuerRef:
    name: letsencrypt-prod-issuer
    kind: ClusterIssuer
    group: cert-manager.io

  # Common name (use wildcard as primary)
  commonName: "*.dev.toolkit.co"

  # DNS names covered by this certificate
  # Wildcard covers: kova.dev.toolkit.co, kova-app-5.dev.toolkit.co, etc.
  dnsNames:
    - "*.dev.toolkit.co"

  # Use DNS01 challenge for wildcard certs
  # (Route53 DNS validation via cert-manager)
  privateKey:
    algorithm: RSA
    size: 2048

# dbt to Metadata Conversion Config
#
# This file configures how dbt schema.yml files are mapped to Starburst Galaxy.
# Drop your dbt schema.yml files into this directory and they'll be auto-converted
# at application startup.
#
# Directory structure:
#   dbt/
#   ├── dbt-config.yaml          # This config file
#   ├── market_insights/         # Organize by domain (optional)
#   │   ├── forecast.yml
#   │   └── exceptions.yml
#   └── inventory/
#       └── stock_levels.yml

# Starburst Galaxy catalog name
catalog: prod_dbt_lake

# Starburst Galaxy schema name
schema: dbt_core_models

# Data source identifier (used internally)
dataSourceId: starburst-galaxy

# Display name for this data source
dataSourceName: Spreetail Data Platform

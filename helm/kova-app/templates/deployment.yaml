apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kova-app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kova-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kova-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kova-app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kova-app.serviceAccountName" . }}
      {{- if .Values.networking.hostNetwork }}
      hostNetwork: true
      {{- end }}
      restartPolicy: Always
      # Pod-level: fsGroup ensures the PVC is writable by the kova group.
      # runAsNonRoot is NOT set because the entrypoint uses the gosu pattern:
      # starts as root to fix volume permissions, then drops to kova (UID 1001).
      securityContext:
        fsGroup: 1001
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The entrypoint uses the gosu pattern (root → kova UID 1001).
          # TODO: Migrate to a non-root container image (no gosu) so we can
          # set runAsNonRoot: true and drop ALL capabilities.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: agent
              containerPort: {{ .Values.ports.agent }}
              protocol: TCP
            - name: dev
              containerPort: {{ .Values.ports.dev }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $_ := .Values.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "kova-app.name" $ }}-env
                  key: {{ $key }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: agent
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: agent
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: agent
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "kova-app.name" . }}-workspace
        - name: tmp
          emptyDir: {}

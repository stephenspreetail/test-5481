# Identity
instanceId: ""             # Kova deployment instance (e.g., "dev", "gabe-pc")
appShortId: ""             # 8-char hex from app GUID (required)
appGuid: ""                # Full UUID (for labels/annotations)
appId: ""                  # Integer ID (for labels only)
appSlug: ""                # User-defined slug (optional, for preview URLs in slug mode)
userId: ""                 # Owner user ID (for labels)

# Container
image:
  repository: "kova-app-container"
  tag: "latest"
  pullPolicy: IfNotPresent

# Ports
ports:
  agent: 3100
  dev: 3000

# Resources
resources:
  requests:
    memory: "4Gi"
    cpu: "1"
  limits:
    memory: "4Gi"
    cpu: "1"

# Health probes — agent server exposes GET /health on the agent port
probes:
  startup:
    enabled: true
    path: /health
    periodSeconds: 5
    failureThreshold: 60       # 5s * 60 = 5 min max startup (npm install, etc.)
  readiness:
    enabled: true
    path: /health
    periodSeconds: 10
    timeoutSeconds: 3
  liveness:
    enabled: true
    path: /health
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# Service account (bare by default; add annotations for IRSA/Pod Identity)
serviceAccount:
  create: true
  annotations: {}

# Storage
storage:
  size: "5Gi"
  storageClass: "ebs-sc"

# Networking
networking:
  hostNetwork: false
  previewDomain: "dev.toolkit.co"
  gatewayName: "istio-system/kova-gateway"

# Preview hostname (computed by orchestrator, passed as value)
previewHostname: ""

# Environment variables (passed as map)
env: {}

# Sensitive environment variables stored in a K8s Secret (passed as map)
secretEnv: {}

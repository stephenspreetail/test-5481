include:
  - project: spreetail/ci-templates
    ref: main
    file: bun.yml

variables:
  RELEASE_NAME: "kova"
  NAMESPACE: "devops"
  BUILD_IMAGE: "oven/bun:1"

  # Environment controls (dev only for now)
  DEV_ENABLED: "true"
  TEST_ENABLED: "false"
  PROD_ENABLED: "false"

  # Feature toggles
  # TODO: re-enable after fixing pre-existing lint errors (104) and test failures (2)
  UNIT_TEST_ENABLED: "false"
  LINT_TEST_ENABLED: "false"
  CODE_QUALITY_SCAN_ENABLED: "false"
  FETCH_DEPENDENCIES_ENABLED: "true"
  # Disable CI template's default --set for deployment.image.* and global.secrets.*
  # because our wrapper Chart.yaml aliases the shared chart as "app", so we pass
  # image settings ourselves via HELM_ARGS with the "app." prefix.
  HELM_STANDARD_SETS_ENABLED: "false"

  # Docker images
  DOCKER_REPOSITORY: "kova/kova"
  APP_CONTAINER_REPOSITORY: "kova/kova-app-container"
  BASE_IMAGE_REPOSITORY: "kova/kova-base"
  SDK_BASE_IMAGE_REPOSITORY: "kova/kova-base-sdk"
  RELEASE_VERSION: ${CI_PIPELINE_IID}
  BUILD_FLAGS: "--build-arg SDK_BASE=${AWS_ACCOUNT_DEV}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SDK_BASE_IMAGE_REPOSITORY}:latest --build-arg BASE=${AWS_ACCOUNT_DEV}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BASE_IMAGE_REPOSITORY}:latest"

  # Helm - pass secrets and app-container image ref as env vars
  # Values prefixed with "app." are passed to the deployment subchart (alias: app)
  # All referenced $VARS must be set as GitLab CI/CD variables (masked/protected)
  HELM_ARGS: >-
    --set app.deployment.image.repository=${AWS_ACCOUNT_DEV}.dkr.ecr.${AWS_REGION}.amazonaws.com/${DOCKER_REPOSITORY}
    --set app.deployment.image.tag=${RELEASE_VERSION}
    --set app.azureEnvVars.enabled=false
    --set app.deployment.env.BACKEND_PORT=3002
    --set app.deployment.env.DB_AUTH_MODE=iam
    --set app.deployment.env.DB_HOST=${KOVA_DB_HOST}
    --set app.deployment.env.DB_PORT=${KOVA_DB_PORT}
    --set app.deployment.env.DB_NAME=${KOVA_DB_NAME}
    --set app.deployment.env.DB_USER=${KOVA_DB_USER}
    --set app.deployment.env.DB_SSL_CA_PATH=/etc/ssl/rds-global-bundle.pem
    --set app.deployment.env.JWT_SECRET=${JWT_SECRET}
    --set app.deployment.env.ENCRYPTION_KEY=${ENCRYPTION_KEY}
    --set app.deployment.env.ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    --set app.deployment.env.ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
    --set app.deployment.env.AGENT_MODEL=${AGENT_MODEL}
    --set app.deployment.env.PROGET_API_KEY=${NPM_TOKEN}
    --set app.deployment.env.DATA_PLATFORM_HOST=${DATA_PLATFORM_HOST}
    --set app.deployment.env.DATA_PLATFORM_USER=${DATA_PLATFORM_USER}
    --set app.deployment.env.DATA_PLATFORM_PASSWORD=${DATA_PLATFORM_PASSWORD}
    --set app.deployment.env.CONTAINER_IMAGE=${AWS_ACCOUNT_DEV}.dkr.ecr.${AWS_REGION}.amazonaws.com/${APP_CONTAINER_REPOSITORY}:${RELEASE_VERSION}
    --set app.deployment.env.K8S_CLUSTER_NAME=dev01-eks-kova
    --set app.deployment.env.K8S_ENVIRONMENT=eks-dev
    --set app.deployment.env.K8S_NAMESPACE=kova-apps
    --set app.deployment.env.PREVIEW_DOMAIN=kova.eks.dev01.tk.dev
    --set app.deployment.env.GITLAB_TOKEN=${GITLAB_TOKEN}
    --set app.deployment.env.KOVA_PLUGIN_REPO=${KOVA_PLUGIN_REPO}
    --set app.deployment.env.KOVA_PLUGIN_NAME=${KOVA_PLUGIN_NAME}
    --set app.deployment.env.KOVA_PLUGIN_BRANCH=${KOVA_PLUGIN_BRANCH}
    --set app.deployment.env.ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
    --set app.deployment.env.ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
    --set app.deployment.env.ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
    --set app.deployment.env.ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI}
    --set app.gateway.tkDevOnly=true
    --set migration.dbHost=${KOVA_DB_HOST}
    --set migration.dbName=${KOVA_DB_NAME}
    --set-string migration.dbPort=${KOVA_DB_PORT}
    --set migration.dbUser=kova_admin

###############################################################################
# Build toolchain fix: ssh2 → cpu-features needs python3/make/g++ for node-gyp
###############################################################################

# Anchor for installing native build deps (oven/bun:1 lacks python3)
.install_build_deps: &install_build_deps
  - apt-get update -qq && apt-get install -y -qq python3 make g++ > /dev/null 2>&1

fetch_dependencies:
  extends: [.bun_fetch_dependencies]
  before_script:
    - *install_build_deps
  script:
    - cd ${PROJECT_DIRECTORY}
    - |
      cat > .npmrc << EOF
      @spreetail:registry=${NPM_REPOSITORY}
      ${NPM_REPOSITORY_NORMALIZED}:_authToken=${NPM_TOKEN}
      registry=https://registry.npmjs.org
      EOF
    - bun install --frozen-lockfile

bun_run_build:
  extends: [.bun_run_build]
  before_script:
    - *install_build_deps
    - cd ${PROJECT_DIRECTORY}
    - |
      cat > .npmrc << EOF
      @spreetail:registry=${NPM_REPOSITORY}
      ${NPM_REPOSITORY_NORMALIZED}:_authToken=${NPM_TOKEN}
      registry=https://registry.npmjs.org
      EOF
    - bun install --frozen-lockfile
  needs: [fetch_dependencies]

###############################################################################
# Additional jobs (beyond what the bun template provides)
###############################################################################

# Docker-in-docker base config for builds that need a real Docker daemon
# (avoids kaniko's CI registry mirror / apt source issues).
.dind_build:
  services:
    - docker:dind
  tags:
    - dev-aks-privileged-runner
  variables:
    KUBEPIPE_USE_DOCKER: "TRUE"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
      docker info >/dev/null 2>&1 || { echo "Docker daemon not available"; exit 1; }

# Base image builds — tagged :latest, only need rebuilding when their
# Dockerfiles change. Run on schedule (Saturday nights) or manually.
.base_image_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: manual
  allow_failure: true

# Runtime base image (bun + kubectl + AWS CLI + RDS CA bundle).
image_build_base:
  extends: [.image_build, .base_image_rules]
  variables:
    DOCKERFILE: "Dockerfile.base"
    DOCKER_REPOSITORY: ${BASE_IMAGE_REPOSITORY}
    RELEASE_VERSION: "latest"
  needs: []
  stage: .pre

# SDK base image (tsc + node-gyp deps for native modules).
image_build_base_sdk:
  extends: [.image_build, .dind_build, .base_image_rules]
  variables:
    DOCKERFILE: "Dockerfile.base-sdk"
    DOCKER_REPOSITORY: ${SDK_BASE_IMAGE_REPOSITORY}
    RELEASE_VERSION: "latest"
  needs: []
  stage: .pre

# Main application image — self-contained multi-stage build (no CI artifacts needed).
# Uses dind to avoid kaniko's apt source issues with multi-stage builds.
image_build:
  extends: [.image_build, .dind_build]
  needs: []

# Build the app-container image (second Docker image).
# Uses docker-in-docker to avoid kaniko layer/cache issues with multi-stage builds.
# Pulls pre-built SDK base from ECR for faster builds.
image_build_app_container:
  extends: [.image_build, .dind_build]
  variables:
    DOCKERFILE: "Dockerfile.appcontainer"
    DOCKER_REPOSITORY: ${APP_CONTAINER_REPOSITORY}
    BUILD_FLAGS: "--build-arg SDK_BASE=${AWS_ACCOUNT_DEV}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SDK_BASE_IMAGE_REPOSITORY}:latest"
  needs: []

# Override release_dev to depend on both image builds
release_dev_aws:
  extends: [.helm_deploy_dev_aws]
  needs:
    - job: image_build
    - job: image_build_app_container
    - job: image_scan
      optional: true

# Override diff_dev to depend on both image builds
diff_dev_aws:
  extends: [.diff_dev_aws]
  needs:
    - job: image_build
    - job: image_build_app_container
    - job: image_scan
      optional: true

###############################################################################
# Local dev certificate deployment (preserved from original pipeline)
###############################################################################

deploy-local-dev-cert:
  stage: .pre
  image: $KUBEPIPE_BUILDER_URL:latest
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    CLUSTER_NAME: dev01-eks-ops
    AWS_ACCOUNT_ID: "851725519214"
    AWS_ROLE: GitLabEksDeployRole
    AWS_REGION: us-east-1
  before_script:
    - source aws-login --aws-account ${AWS_ACCOUNT_ID} --aws-role ${AWS_ROLE} --aws-region ${AWS_REGION} --k8s-cluster-name ${CLUSTER_NAME}
    - kubectl cluster-info
    - kubectl get nodes
  script:
    - chmod +x scripts/deploy-local-dev-certs.sh
    - ./scripts/deploy-local-dev-certs.sh
  environment:
    name: dev01-eks-ops/local-dev-certs
    action: prepare
  tags:
    - dev-aks-runner
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_MERGE_REQUEST_IID
      when: manual
  allow_failure: true

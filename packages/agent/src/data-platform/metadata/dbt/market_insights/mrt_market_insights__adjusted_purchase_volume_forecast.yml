version: 2

models:
  - name: mrt_market_insights__adjusted_purchase_volume_forecast
    description: >
      Current state (latest Tuesday snapshot) of price-adjusted purchase volume forecasts for
      Amazon ASINs at specific search result positions. This mart provides the most recent weekly
      forecast data for consumption by downstream analytics.
      
      Key features:
      - Filters to most recent Tuesday from weekly historical snapshots
      - Provides price-adjusted purchase volume using competitive pricing dynamics
      - Enriched with category classifications, search volumes, and conversion predictions
      - Ready for consumption by Power BI, Tableau, and other analytics tools
      
      Business use cases:
      - Market opportunity analysis and keyword prioritization
      - Competitive positioning and pricing strategy
      - Search term performance forecasting
      - Category-level volume projections
      - Ad spend optimization based on forecasted volumes
      
      Data lineage:
      - Source: int_market_insights__amazon_adjusted_volume_forecast_weekly
      - Grain: ASIN × Search Term × Overall Position (for most recent Tuesday)
      - Update frequency: Weekly (every Tuesday)

    config:
      tags:
        - snowflake
    
    columns:
      - name: asin
        description: "Amazon Standard Identification Number - unique product identifier"
        tests:
          - not_null
      
      - name: search_term
        description: "Amazon search term/keyword for which this ASIN appears in results"
        tests:
          - not_null
      
      - name: overall_position
        description: "Overall position of this ASIN in search results (1-based ranking)"
        tests:
          - not_null
      
      - name: product_url
        description: "Amazon product URL for this ASIN"
      
      - name: title
        description: "Product title from Amazon search results"
      
      - name: page
        description: "Search results page number where this ASIN appears"
      
      - name: position_on_page
        description: "Position of this ASIN within its search results page"
      
      - name: organic_position
        description: "Organic (non-sponsored) position in search results"
      
      - name: rating
        description: "Product rating (out of 5 stars)"
      
      - name: review_count
        description: "Number of customer reviews for this product"
      
      - name: price
        description: "Product price at the time of scraping (original/actual price)"
      
      - name: adjusted_price
        description: >
          Price adjusted for null/zero values using mean price of top 90 positions.
          Used in volume adjustment calculations.
      
      - name: tags
        description: "Product tags from Amazon search results (e.g., 'Amazon's Choice', 'Best Seller')"
      
      - name: delivery_info
        description: "Delivery information displayed in search results"
      
      - name: bought_past_month
        description: "Number of units bought in the past month (if displayed on Amazon)"
      
      - name: options
        description: "Available product options/variations"
      
      - name: updated_at
        description: "Timestamp when the search results data was last updated/scraped"
        tests:
          - not_null
      
      - name: impression_vol_forecast
        description: "Forecasted impression volume for this position and keyword"
      
      - name: click_vol_forecast
        description: "Forecasted click volume for this position and keyword"
      
      - name: purchase_vol_forecast
        description: >
          Original forecasted purchase volume for this position and keyword (before price adjustment).
          Use adjusted_purchase_vol_forecast for analysis that accounts for pricing.
      
      - name: adjusted_purchase_vol_forecast
        description: >
          **PRIMARY METRIC** - Price-adjusted purchase volume forecast. Applies exponential penalty
          for prices above the mean of top 90 positions, then renormalizes to preserve total keyword
          volume. This is the recommended metric for business decisions.
      
      - name: impression_share_forecast
        description: "Forecasted impression share (% of total impressions for this keyword)"
      
      - name: click_share_forecast
        description: "Forecasted click share (% of total clicks for this keyword)"
      
      - name: purchase_share_forecast
        description: "Forecasted purchase share (% of total purchases for this keyword)"
      
      - name: forecast_update_dt
        description: "Timestamp when the forecast data was created/updated in the source system"
      
      - name: snapshot_created_at
        description: "Timestamp when this snapshot was created"

      - name: search_volume_pred
        description: >
          Predicted search volume for this keyword from search volume gap prediction model.
          Used for prioritizing high-volume opportunities.
      
      - name: c2c_forecast
        description: "Click-to-conversion (C2C) rate forecast for this ASIN and keyword"
      
      - name: ctr_forecast
        description: "Click-through rate (CTR) forecast for this ASIN and keyword"

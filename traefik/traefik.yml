# Traefik static configuration
api:
  insecure: true
  dashboard: true

entryPoints:
  preview:
    address: ":8081"

providers:
  # HTTP provider for dynamic routing (backend serves route config)
  # This polls the backend for route configuration every 2 seconds
  http:
    # TRAEFIK_BACKEND_HOST and TRAEFIK_BACKEND_PORT should be set via environment variables
    # Local: host.docker.internal (Docker) or <your-ip> (Podman/Windows)
    # Dev/Prod: backend (container network)
    endpoint: "http://{{ env "TRAEFIK_BACKEND_HOST" }}:{{ env "TRAEFIK_BACKEND_PORT" }}/api/traefik/config"
    pollInterval: 2s

  # File provider for static routes (dashboard, etc.)
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

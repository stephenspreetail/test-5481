# Traefik static configuration
api:
  insecure: true
  dashboard: true

entryPoints:
  preview:
    address: ":8081"

providers:
  # Docker provider - auto-discovers routes via container labels
  # Works with any OCI runtime (Docker, Podman, Rancher Desktop)
  docker:
    exposedByDefault: false
    network: kova-network

  # File provider for static routes (dashboard, etc.)
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

services:
  # Traefik reverse proxy for app preview routing
  traefik:
    image: traefik:v3.0
    container_name: kova-traefik
    environment:
      - TRAEFIK_BACKEND_HOST=${TRAEFIK_BACKEND_HOST:-host.docker.internal}
      - TRAEFIK_BACKEND_PORT=${TRAEFIK_BACKEND_PORT:-3002}
    ports:
      - "8081:8081" # Preview access (app-{id}.localhost:8081) + Dashboard (traefik.localhost:8081)
    volumes:
      # Static config
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic config directory for static routes (dashboard, etc.)
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    extra_hosts:
      # Allow Traefik to reach the backend on host machine
      - "host.docker.internal:host-gateway"
    networks:
      - kova-network

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: kova-postgres
    environment:
      POSTGRES_USER: kova
      POSTGRES_PASSWORD: kova_dev_password
      POSTGRES_DB: kova
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kova-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kova"]
      interval: 5s
      timeout: 5s
      retries: 5


  # App container image (build only, not run as a service)
  # This builds the image that will be spawned dynamically by the backend
  app-container:
    build:
      context: ./app-container
      dockerfile: Dockerfile
    image: kova-app-container:latest
    # This container is not meant to run as a service
    # It's just here to build the image
    profiles:
      - build-only

networks:
  kova-network:
    name: kova-network
    driver: bridge

volumes:
  postgres_data:

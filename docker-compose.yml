  # App container image (build only, not run as a service)
  # This builds the image that will be spawned dynamically by the backend
  app-container:
    build:
      context: ./app-container
      dockerfile: Dockerfile
    image: kova-app-container:latest
    # This container is not meant to run as a service
    # It's just here to build the image
    profiles:
      - build-only

networks:
  kova-network:
    name: kova-network
    driver: bridge

volumes:
